<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>부동산업 게임 선택</title>
  <style>
    :root {
      --bg-color: #f3f4f6;
      --card-bg: #ffffff;
      --primary-color: #3b82f6; /* 부동산업 파란색 테마 */
      --text-main: #1f2937;
      --text-sub: #6b7280;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, sans-serif;
      background-color: var(--bg-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .select-container {
      text-align: center;
      max-width: 800px;
      width: 100%;
      padding: 20px;
      box-sizing: border-box;
    }

    .title-area h2 {
      font-size: 2rem;
      color: var(--text-main);
      margin-bottom: 10px;
    }

    .title-area p {
      color: var(--text-sub);
      font-size: 1.1rem;
      margin-bottom: 40px;
    }

    .game-choices {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 24px;
    }

    /* 게임 카드 공통 스타일 */
    .game-card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 30px;
      text-align: left;
      text-decoration: none;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
      border: 2px solid transparent;
    }

    /* 1번 게임 (활성화 상태) */
    .game-card.active {
      cursor: pointer;
    }

    .game-card.active:hover {
      transform: translateY(-8px);
      border-color: var(--primary-color);
      box-shadow: 0 20px 25px -5px rgba(59, 130, 246, 0.1), 0 10px 10px -5px rgba(59, 130, 246, 0.04);
    }

    /* 2번 게임 (비활성화/잠금 상태) */
    .game-card.locked {
      background: #e5e7eb;
      cursor: not-allowed;
      opacity: 0.7;
    }

    .badge {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 50px;
      font-size: 0.85rem;
      font-weight: bold;
      margin-bottom: 15px;
      width: fit-content;
    }

    .active .badge {
      background-color: #dbeafe;
      color: #1e40af;
    }

    .locked .badge {
      background-color: #d1d5db;
      color: #374151;
    }

    .game-title {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--text-main);
      margin: 0 0 10px 0;
    }

    .game-desc {
      font-size: 0.95rem;
      color: var(--text-sub);
      line-height: 1.5;
      margin: 0 0 30px 0;
    }

    .action-btn {
      font-weight: 600;
      font-size: 1rem;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .active .action-btn {
      color: var(--primary-color);
    }

    .locked .action-btn {
      color: #9ca3af;
    }

    /* 돌아가기 버튼 */
    .back-link {
      display: inline-block;
      margin-top: 40px;
      color: var(--text-sub);
      text-decoration: none;
      font-size: 0.95rem;
      transition: color 0.2s;
    }

    .back-link:hover {
      color: var(--text-main);
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="select-container">
    <div class="title-area">
      <h2>🎮 부동산 회계 게임 선택</h2>
      <p>원하는 시뮬레이션 게임을 선택하여 플레이해보세요!</p>
    </div>
    
    <div class="game-choices">
      <a href="./부동산_ldh.html" class="game-card active">
        <div>
          <span class="badge">PLAY NOW</span>
          <h3 class="game-title">부동산 회계 부루마불</h3>
          <p class="game-desc">주택, 아파트, 건물을 매수하고 연말결산까지!<br>레버리지형, 안정추구형 등 나만의 전략으로 자산을 불려보세요.</p>
        </div>
        <div class="action-btn">게임 시작하기 ➔</div>
      </a>

      <div class="game-card locked">
        <div>
          <span class="badge">🔒 LOCKED</span>
          <h3 class="game-title">새로운 부동산 게임</h3>
          <p class="game-desc">더 유익하고 재미있는 새로운 부동산 회계 시뮬레이션 게임이 곧 추가될 예정입니다.</p>
        </div>
        <div class="action-btn">준비 중인 게임입니다</div>
      </div>
    </div>

    <a href="index.html" class="back-link">⬅ 홈으로 돌아가기</a>
  </div>

</body>
</html>
