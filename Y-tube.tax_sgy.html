        }
        
        .cell {

        }
        .cell-icon { font-size: 32px; margin-bottom: 5px; }
        .cell-info { font-size: 11px; color: #777; text-align: center; margin-top: 2px; }
        
        .inner-center { 
            grid-column: 2 / 8; grid-row: 2 / 8; 
            background: #f1f2f6; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; border: 2px dashed #bbb;
        }
        
        #side-panel { width: 500px; background: #2f3542; color: white; padding: 20px; overflow-y: auto; }
        
        .player-card { background: rgba(255,255,255,0.1); padding: 15px; margin-bottom: 20px; border-radius: 10px; border-left: 8px solid transparent; }

        .fs-table { width: 100%; font-size: 13px; color: white; border-collapse: collapse; margin-top: 8px; }
        .fs-table td, .fs-table th { border: 1px solid #57606f; padding: 6px; text-align: right; }
        .fs-table th { background: rgba(255,255,255,0.2); text-align: center; font-size: 12px; }
        .fs-title { font-size: 14px; font-weight: bold; color: #eccc68; margin-top: 12px; border-bottom: 1px solid #57606f; padding-bottom: 3px; }

        .journal-table th { color: #747d8c; border-bottom: 1px solid #57606f; padding-bottom: 5px; text-align: center; }
        .journal-table td { padding: 4px; border-bottom: 1px solid #333; }

        .ledger-toggle {
            width: 100%; margin-top: 10px; padding: 8px; background: #57606f; 
            color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 12px;
        }
        .ledger-toggle:hover { background: #6f7a8a; }
        .ledger-content { 
            display: none; background: #000; margin-top: 5px; max-height: 150px; 
            overflow-y: auto; border-radius: 4px; padding: 10px;
        }

        .tb-toggle {
            width: 100%; margin-top: 5px; padding: 8px; background: #eccc68; 
            color: #2f3542; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold;
        }
        .tb-toggle:hover { background: #f1d484; }
        .tb-content { 
            display: none; background: #fffbe6; color: #333; margin-top: 5px;

        }

        .tb-table td { border: 1px solid #ddd; padding: 4px; text-align: right; }
        .tb-table .item-name { text-align: center; background: #fafafa; font-weight: bold; }

        .setup-box { background: white; padding: 50px; border-radius: 20px; text-align: center; width: 500px; }

        .red-out {
           /* sepia를 제거하고 밝기를 낮춘 뒤 강렬한 빨간색 필터를 씌웁니다 */
    filter: brightness(0.4) sepia(1) hue-rotate(-50deg) saturate(5) contrast(1.5);

            60% { transform: translate(-3px, 1px) rotate(0deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }

function applyCardEffect(p, card) {
    // 1. 기본 금액 처리
    if (card.m && card.m < 0) {
        let costAmount = Math.abs(card.m); // 음수를 양수로 변환
        p.cash -= costAmount;
        p.expense += costAmount;

        // 2. 계정과목 결정 (카드 제목이나 분개 데이터를 활용)
        let accountName = "잡비"; // 기본값
        
        if (card.t.includes("지급수수료") || (card.j && card.j[0].includes("지급수수료"))) {
            accountName = "지급수수료";
        } else if (card.t.includes("여비교통비") || (card.j && card.j[0].includes("여비교통비"))) {
            accountName = "여비교통비";
        } else if (card.t.includes("도서인쇄비") || (card.j && card.j[0].includes("도서인쇄비"))) {
            accountName = "도서인쇄비";
        } else if (card.t.includes("임차료") || (card.j && card.j[0].includes("임차료"))) {
            accountName = "임차료";
        } else if (card.t.includes("벌금") || card.t.includes("리스크") || card.t.includes("세무")) {
            accountName = "세금과공과";
        } else if (card.t.includes("비용")) {
            accountName = "콘텐츠제작비"; // 일반적인 비용
        }

        // 3. ★ 핵심: 시산표(T/B) 세부 내역에 기록
        if (!p.expenseDetails[accountName]) {
            p.expenseDetails[accountName] = { amount: 0, isNonOp: false };
        }
        p.expenseDetails[accountName].amount += costAmount;
    }

    // 4. 분개 기록 (카드에 있는 j 데이터 활용)
    if (card.j) {
        recordJournal(p, card.j[0], card.j[1]);
    }
    
    // (기타 수익, 구독자 처리 로직...)
    updateUI();
}

let maxP = 0, currentSetupP = 0, players = [], turn = 0, isGameOver = false;

function setTotalPlayers(num) { maxP = num; document.getElementById('step-1').style.display = 'none'; document.getElementById('step-2').style.display = 'block'; }

function confirmPlayerJob() {
    const nick = document.getElementById('nickname-input').value.trim() || `플레이어${currentSetupP + 1}`;
    players.push({
        id: currentSetupP + 1, 
        nickname: nick,
        job: document.getElementById('job-select').value,
        cash: 5000000, fAsset: 0, debt: 0, revenue: 0, expense: 0,expenseDetails: {}, subs: 0, pos: 0,
        lastJournal: { left: "-", right: "-" },
        journalHistory: []
    });
    document.getElementById('nickname-input').value = "";
    currentSetupP++;
    if(currentSetupP < maxP) document.getElementById('setup-title').innerText = `플레이어 ${currentSetupP + 1} 설정`;
    else startGame();
}

function recordJournal(player, left, right) {
    const entry = { left, right, time: new Date().toLocaleTimeString() };
    player.lastJournal = entry;
    player.journalHistory.unshift(entry);
}

function toggleLedger(pid) {
    const content = document.getElementById(`ledger-${pid}`);
    content.style.display = content.style.display === 'block' ? 'none' : 'block';
}

function toggleTB(pid) {
    const content = document.getElementById(`tb-${pid}`);

}

function startGame() { document.getElementById('setup-layer').style.display = 'none'; document.getElementById('main-container').style.display = 'flex'; initBoard(); updateUI(); }

function initBoard() {
    const board = document.getElementById('board-section');
    boardData.forEach((d, i) => {
        const cell = document.createElement('div');
        cell.className = 'cell'; cell.id = `cell-${i}`;
        let r, c;
        if(i < 8) { r = 8; c = 8 - i; } else if(i < 15) { r = 15 - i; c = 1; } else if(i < 22) { r = 1; c = i - 13; } else { r = i - 20; c = 8; }
        cell.style.gridRow = r; cell.style.gridColumn = c;
        cell.innerHTML = `<div class="cell-icon">${d.icon}</div><b>${d.name}</b><div class="cell-info">${d.info}</div><div id="piece-box-${i}" style="position:absolute; bottom:5px; left:0; width:100%; display:flex; justify-content:center; flex-wrap:wrap;"></div>`;
        board.appendChild(cell);
    });
}

function generateTB(p) {
    // 1. 수익 및 비용 분류 계산
    const nonOpRevTotal = p.revenueDetails?.["잡이익"] || 0; // 잡이익 합계
    const opRevTotal = p.revenue - nonOpRevTotal;         // 전체수익 - 잡이익 = 영업수익

    let opExpTotal = 0;
    let nonOpExpTotal = 0;
    for (let key in p.expenseDetails) {
        const item = p.expenseDetails[key];
        if (item.isNonOp) nonOpExpTotal += item.amount;
        else opExpTotal += item.amount;
    }

    // 2. 데이터 배열 구성 (표에 표시될 순서대로)
    const finalData = [
        { name: "현금(당좌자산)", sumL: p.cash + p.expense + p.fAsset, sumR: p.revenue + p.debt + 5000000, balL: p.cash, balR: 0 },
        { name: "유형자산", sumL: p.fAsset, sumR: 0, balL: p.fAsset, balR: 0 },
        { name: "부채", sumL: 0, sumR: p.debt, balL: 0, balR: p.debt },
        { name: "자본금(자본)", sumL: 0, sumR: 5000000, balL: 0, balR: 5000000 },
        
        // [수익 섹션]
        { name: "수익", sumL: 0, sumR: opRevTotal, balL: 0, balR: opRevTotal },
        { name: "영업외수익", sumL: 0, sumR: nonOpRevTotal, balL: 0, balR: nonOpRevTotal },
        // 잡이익이 있을 때만 세부 내역 표시
        ...(nonOpRevTotal > 0 ? [{ name: "잡이익", sumL: 0, sumR: nonOpRevTotal, balL: 0, balR: nonOpRevTotal, isSub: true }] : []),

        // [비용 섹션]
        { name: "비용", sumL: opExpTotal, sumR: 0, balL: opExpTotal, balR: 0 },
        ...Object.keys(p.expenseDetails).filter(k => !p.expenseDetails[k].isNonOp).map(k => ({
            name: k, sumL: p.expenseDetails[k].amount, sumR: 0, balL: p.expenseDetails[k].amount, balR: 0, isSub: true
        })),
        { name: "영업외비용", sumL: nonOpExpTotal, sumR: 0, balL: nonOpExpTotal, balR: 0 },
        ...Object.keys(p.expenseDetails).filter(k => p.expenseDetails[k].isNonOp).map(k => ({
            name: k, sumL: p.expenseDetails[k].amount, sumR: 0, balL: p.expenseDetails[k].amount, balR: 0, isSub: true
        }))
    ];

    // 3. HTML 생성
    let html = finalData.map(d => {
        const isSub = d.isSub;
        const isHeader = ["영업수익", "영업외수익", "영업비용", "영업외비용"].includes(d.name);
        
        return `
        <tr>
            <td>${(d.balL || 0).toLocaleString()}</td>
            <td>${(d.sumL || 0).toLocaleString()}</td>
            <td class="item-name" style="text-align:left; 
                ${isSub ? 'padding-left:30px; color:#888;' : ''}
                ${isHeader ? 'background:#f9f9f9; font-weight:bold;' : ''}">
                ${d.name}
            </td>
            <td>${(d.sumR || 0).toLocaleString()}</td>
            <td>${(d.balR || 0).toLocaleString()}</td>
        </tr>`;
    }).join("");

    // 4. 합계 계산 (중복 방지를 위해 세부항목(isSub)은 제외하고 계산)
    const totalBalL = finalData.filter(d => !d.isSub).reduce((s, d) => s + (d.balL || 0), 0);
    const totalBalR = finalData.filter(d => !d.isSub).reduce((s, d) => s + (d.balR || 0), 0);

    html += `<tr style="background:#fdf5d2; font-weight:bold;">
        <td>${totalBalL.toLocaleString()}</td><td></td><td class="item-name">합 계</td><td></td><td>${totalBalR.toLocaleString()}</td>
    </tr>`;
    
    return html;
}

async function rollDice() {
    if(isGameOver) return;
    const btn = document.getElementById('roll-btn');
    btn.disabled = true;
    let dice = 0;
    for(let i=0; i<8; i++) {
        dice = Math.floor(Math.random() * 6) + 1;
        document.getElementById('dice-val').innerText = ["", "⚀", "⚁", "⚂", "⚃", "⚄", "⚅"][dice];
        await new Promise(r => setTimeout(r, 70));
    }
    let p = players[turn];
    let oldPos = p.pos;
    p.pos = (p.pos + dice) % 28;

    if(p.pos < oldPos) { 
        let tax = Math.floor(p.cash * 0.1);
        p.cash -= tax; p.expense += tax;
        if (!p.expenseDetails["세금과공과"]) {
            p.expenseDetails["세금과공과"] = { amount: 0, isNonOp: false }; 
        }
        p.expenseDetails["세금과공과"].amount += tax;
        p.cash += 3000000; p.revenue += 3000000;
        alert(`결산기 도래!\n소득세 납부: -${tax.toLocaleString()}원\n기말 정산금: +3,000,000원`);
        recordJournal(p, `세금과공과 ${tax.toLocaleString()}`, `현금 ${tax.toLocaleString()}`);
        recordJournal(p, "현금 3,000,000", "수익 3,000,000");
    }
    setTimeout(() => {
        handleCell(p, boardData[p.pos]);
        checkGameOver();
        if(!isGameOver) { turn = (turn + 1) % maxP; btn.disabled = false; updateUI(); }
    }, 300);
}

function handleCell(p, cell) {
    if(cell.type === "asset") {
        if(cell.owner === null) {
            if(confirm(`[${cell.name}] 매입하시겠습니까?\n비용: ${cell.cost.toLocaleString()}원`)) {
                if(p.cash >= cell.cost) { 
                    p.cash -= cell.cost; p.fAsset += cell.cost; p.subs += cell.sub; cell.owner = turn; 
                    const target = document.getElementById(`cell-${p.pos}`);
                    target.style.backgroundColor = `var(--p${turn + 1})`; target.style.color = "white";
                    target.querySelector('.cell-info').style.color = "#eee";
                    recordJournal(p, `${cell.jName} ${cell.cost.toLocaleString()}`, `현금 ${cell.cost.toLocaleString()}`);
                } else alert("현금이 부족합니다!");
            }
        } else if(cell.owner !== turn) {
            let fee = Math.floor(cell.cost * 0.1);
            alert(`타인의 자산! 출연료 ${fee.toLocaleString()}원 지급.`);
            p.cash -= fee; p.expense += fee; players[cell.owner].cash += fee; players[cell.owner].revenue += fee;
            if (!p.expenseDetails["지급수수료"]) {
        p.expenseDetails["지급수수료"] = { amount: 0, isNonOp: false };
    }
    p.expenseDetails["지급수수료"].amount += fee;
            recordJournal(p, `지급수수료 ${fee.toLocaleString()}`, `현금 ${fee.toLocaleString()}`);
            recordJournal(players[cell.owner], `현금 ${fee.toLocaleString()}`, `수익 ${fee.toLocaleString()}`);
        }
    } else if(cell.type === "event") drawGoldenKey(p);
    else if(cell.type === "exp") { 
        // 1. 기본 비용 처리 (모든 비용 칸 공통)
        p.cash -= cell.cost; 
        p.expense += cell.cost; 
        p.subs += cell.sub; 
        const jName = cell.jName || "기타비용";
       // [추가] 기부금일 경우 영업외비용으로 분류하기 위한 체크
        const isNonOp = (jName === "기부금");

        // [수정] expenseDetails 구조를 숫자에서 객체로 변경하여 저장
        if (!p.expenseDetails[jName]) {
            p.expenseDetails[jName] = { amount: 0, isNonOp: isNonOp };
        }
        
        // 기존에 숫자로 되어있을 경우를 대비한 안전장치 포함
        if (typeof p.expenseDetails[jName] === 'number') {
            p.expenseDetails[jName] = { amount: p.expenseDetails[jName], isNonOp: isNonOp };
        }

        p.expenseDetails[jName].amount += cell.cost;

        // 분개 기록 (중복 기록되지 않게 한 번만 작성)
        recordJournal(p, `${jName} ${cell.cost.toLocaleString()}`, `현금 ${cell.cost.toLocaleString()}`);

        // 2. [특별 이벤트] UNICEF 후원 칸일 경우에만 실행
        if(cell.name === "UNICEF 후원") {
            const luck = Math.random(); 

            if(luck < 0.3) { 
                const reward = cell.cost * 2; 
                
                setTimeout(() => {
                    alert(`✨ 기부의 기적! ✨\n후원에 감동한 익명의 팬이 제작비로 ${reward.toLocaleString()}원을 보냈습니다!`);
                    
                    p.cash += reward;
                    p.revenue += reward; // 전체 수익 합계에 포함

                    // [추가] 영업외수익(잡이익) 상세 내역 저장
                    if (!p.revenueDetails) p.revenueDetails = {}; 
                    p.revenueDetails["잡이익"] = (p.revenueDetails["잡이익"] || 0) + reward;
                    
                    recordJournal(p, `현금 ${reward.toLocaleString()}`, `잡이익(영업외수익) ${reward.toLocaleString()}`);
                    updateUI(); 
                }, 600);
            } else {
                setTimeout(() => {
                    alert("따뜻한 후원에 감사드립니다! 구독자들의 응원 댓글이 쏟아집니다.");
                }, 600);
            }
        }
    
    } else if(cell.type === "income") { 
        p.cash += cell.gain; p.revenue += cell.gain; if(cell.sub) p.subs += cell.sub; 
        recordJournal(p, `현금 ${cell.gain.toLocaleString()}`, `${cell.jName} ${cell.gain.toLocaleString()}`);
   } else if(cell.type === "jail") {
        document.body.classList.add('red-out', 'noise-shake');
        setTimeout(() => {
            const choice = confirm(`[🚨 뒷광고 논란 발생!] 선택이 필요합니다.\n\n확인(OK): 벌금을 냅니다. (현금의 50% 차감)\n취소(Cancel): 자숙하여 구독자가 감소합니다. (구독자 50% 차감)`);
            if(choice) {
                const fine = Math.floor(p.cash * 0.5);
                p.cash -= fine; p.expense += fine;
                if (!p.expenseDetails["세금과공과"]) {
                p.expenseDetails["세금과공과"] = { amount: 0, isNonOp: false };
            }
            p.expenseDetails["세금과공과"].amount += fine;
                alert(`벌금으로 ${fine.toLocaleString()}원이 지출되었습니다.`);
                recordJournal(p, `세금과공과 ${fine.toLocaleString()}`, `현금 ${fine.toLocaleString()}`);
            } else {
                const lostSubs = (p.subs * 0.5).toFixed(1);
                p.subs = parseFloat((p.subs * 0.5).toFixed(1));
                alert(`자숙의 시간을 갖습니다. 구독자가 ${lostSubs}만 명 감소했습니다.`);
                recordJournal(p, "구독자 급감 (무형자산 감소)", "-");
            }
            document.body.classList.remove('red-out', 'noise-shake');
            updateUI(); 
        }, 100);
    } 
    // --- [새로 추가된 저작권 침해 로직] ---
else if(cell.type === "copyright") {
        document.body.classList.add('red-out', 'noise-shake');
        
        // 💡 핵심 수정: turn 변수는 실시간으로 변하지만, 
        // p.id는 현재 주사위를 굴린 사람의 고정된 번호입니다. (1부터 시작하므로 -1)
        const myId = p.id - 1; 

        setTimeout(() => {
            alert(`[🚫 저작권 침해 콘텐츠 삭제]\n${p.nickname}님의 채널 자산 중 하나가 무작위로 삭제됩니다!`);
            
            // 1. 전체 보드판에서 '나(myId)'의 자산만 찾아 인덱스를 수집
            let myAssetIndices = [];
            for(let i = 0; i < boardData.length; i++) {
                if(boardData[i].owner === myId) {
                    myAssetIndices.push(i);
                }
            }

            if (myAssetIndices.length > 0) {
                // 2. 내 자산 중 하나를 무작위 선택
                const randomIndex = myAssetIndices[Math.floor(Math.random() * myAssetIndices.length)];
                const targetAsset = boardData[randomIndex];
                

                // 3. 데이터 업데이트 (내 돈 깎고, 소유권 없애기)
                p.fAsset -= targetAsset.cost;
                p.expense += targetAsset.cost; 
                if (!p.expenseDetails["잡손실"]) {
                p.expenseDetails["잡손실"] = { amount: 0, isNonOp: true }; // 영업외비용으로 처리
            }
            p.expenseDetails["잡손실"].amount += targetAsset.cost;
                targetAsset.owner = null; 

                // 4. UI 복구 (해당 칸을 다시 흰색으로)
                const cellElement = document.getElementById(`cell-${randomIndex}`);
                if (cellElement) {
                    cellElement.style.backgroundColor = "white";
                    cellElement.style.color = "black";
                    const infoText = cellElement.querySelector('.cell-info');
                    if(infoText) infoText.style.color = "#777";
                }

                alert(`[${targetAsset.name}] 자산이 삭제되었습니다.`);
                recordJournal(p, `잡손실(자산손상차손) ${targetAsset.cost.toLocaleString()}`, `${targetAsset.name} 삭제`);
            } else {
                alert("삭제할 자산이 없어 무사히 넘어갑니다.");
            }

            document.body.classList.remove('red-out', 'noise-shake');
            updateUI();
        }, 100);
    }
}

function drawGoldenKey(p) {
    const r = Math.random();
    if(r < 0.6) {
        const myCards = cards[p.job];
        const card = myCards[Math.floor(Math.random() * myCards.length)];
        alert(`[황금열쇠]\n${card.t}\n${card.msg || ""}`);
        if(card.m) { 
            p.cash += card.m; 
            if(card.m > 0) p.revenue += card.m; 
            else p.expense += Math.abs(card.m); 
        }
        if(card.s) p.subs += card.s;
        if(card.asset) p.fAsset += card.asset;
        if(card.j) recordJournal(p, card.j[0], card.j[1]);
    } else if(r < 0.85) {
        const q = cards.OX[Math.floor(Math.random() * cards.OX.length)];
        const ans = confirm(`[O/X 퀴즈]\n${q.q}`);
        if(ans === q.a) { 
            alert("정답! +50만"); 
            p.cash += 500000; 
            p.revenue += 500000; 
            recordJournal(p, "현금 500,000", "수익 500,000"); 
        } else {
            alert("오답!");
        }
    } else {
    const sc = cards.SPECIAL[Math.floor(Math.random() * cards.SPECIAL.length)];
    alert(`[특수!]\n${sc.t}\n${sc.msg}`);
    
    // 1. 비율 차감 로직 (세무조사 등)
    if(sc.rate) { 
        const tax = Math.floor(p.cash * sc.rate); 
        p.cash -= tax; 
        p.expense += tax; 

        // [중요] 시산표 상세 내역(expenseDetails)에 반영
        if (!p.expenseDetails["세금과공과"]) {
            p.expenseDetails["세금과공과"] = { amount: 0, isNonOp: false }; // 영업비용으로 설정
        }
        p.expenseDetails["세금과공과"].amount += tax;

        recordJournal(p, `세금과공과 ${tax.toLocaleString()}`, `현금 ${tax.toLocaleString()}`); 
    } 
    
    // 2. 일반 금액 처리 (기존 로직 유지)
    if(sc.m) { 
        p.cash += sc.m; 
        if(sc.m > 0) p.revenue += sc.m;
        else {
            p.expense += Math.abs(sc.m);
            // 일반 마이너스 금액도 필요하다면 여기에 세부 항목 처리를 추가할 수 있습니다.
        }
    }
    
    if(sc.s) p.subs += sc.s;
    }
}

function checkGameOver() {
    players.forEach(p => {
        if(p.subs >= 100) {
            isGameOver = true;
            document.getElementById('turn-info').innerText = "🎉 100만 달성! 🎉";
            const winner = [...players].sort((a,b) => ((b.cash+b.fAsset)-b.debt) - ((a.cash+a.fAsset)-a.debt))[0];
            alert(`최종 승자: ${winner.nickname}님`);
            document.getElementById('roll-btn').style.display = 'none';
        }
    });
}
